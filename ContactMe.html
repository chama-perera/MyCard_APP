<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Me - Chamath Perera</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contact-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
      align-items: center;
    }

    .info-box {
      background-color: #e0e0e0;
      padding: 20px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      min-width: 250px;
    }

    .info-box h3 {
      margin: 0 0 10px;
      color: #333;
    }

    .info-box p {
      font-size: 16px;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .info-box img {
      width: 20px;
      height: 20px;
    }

    .social-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .social-buttons a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background-color: #d9d9d9;
      border-radius: 30px;
      text-decoration: none;
      color: #000;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, background-color 0.2s ease;
      min-width: 200px;
      justify-content: center;
    }

    .social-buttons a:hover {
      transform: scale(1.05);
      background-color: #cfcfcf;
    }

    .social-buttons img {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

  <div class="contact-container">
    <div class="info-box">
      <h3>Mobile</h3>
      <p>
        <img src="Icons/whatsapp.png" alt="WhatsApp" />
        <img src="Icons/teligram.png" alt="Telegram" />
        +94 76 52 56 718
      </p>
    </div>
    <div class="info-box">
      <h3>Email</h3>
      <img src="Icons/email.png" alt="Email">
      <p>chamathmadusanka175@gmail.com</p>
    </div>
  </div>

  <div class="social-buttons">
    <a href="https://www.instagram.com/chamaa_1399" target="_blank">
      <img src="Icons/instagram.png" alt="Instagram" /> Instagram
    </a>
    <a href="https://www.facebook.com/Chamath Madusanka" target="_blank">
      <img src="Icons/facebook.png" alt="Facebook" /> Facebook
    </a>
    <a href="https://www.linkedin.com/in/chamath-perera-8250a5254" target="_blank">
      <img src="Icons/linkedin.png" alt="LinkedIn" /> LinkedIn
    </a>
    <a href="https://github.com/chama-perera" target="_blank">
      <img src="Icons/github.png" alt="GitHub" /> GitHub
    </a>
    <a href="https://www.threads.net/@chamaa_1399" target="_blank">
      <img src="Icons/threads.png" alt="Threads" /> Threads
    </a>
  </div>

</body>
</html>
